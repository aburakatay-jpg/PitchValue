[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchvalue"
version = "0.1.0"
description = "Technical foundation for PitchValue"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.52,<0.53",
]

[project.scripts]
pitchvalue-ingest = "pitchvalue.ingestion.football_data_uk.cli:main"
pitchvalue-api = "pitchvalue.api.cli:main"
pitchvalue-refresh-stale = "pitchvalue.operations.refresh_stale:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires the local PostgreSQL service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
