name: Fixture Visibility Report

on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * *"
jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project and reporting dependencies
        run: |
          pip install .
          pip install python-dotenv google-auth google-auth-oauthlib google-api-python-client

      - name: Materialize Google Drive OAuth token
        if: ${{ secrets.GOOGLE_DRIVE_OAUTH_TOKEN_JSON != '' }}
        env:
          GOOGLE_DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$GOOGLE_DRIVE_OAUTH_TOKEN_JSON" > secrets/google-drive-oauth-token.json

      - name: Generate fixture visibility report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
        run: python backend/generate_fixture_visibility_report.py
